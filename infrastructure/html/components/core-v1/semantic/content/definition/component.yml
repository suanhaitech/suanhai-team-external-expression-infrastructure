id: content.definition
version: 1.0.0
category: content
role: 界定概念对象、定义句和适用边界
required_slots:
  - term
  - definition
optional_slots:
  - boundary
  - source_ids
states:
  - draft
  - confirmed
template: template.html
styles: ../../semantic.css
responsive: 窄屏单列自然增高，长文本正常换行
accessibility: 标题与状态可见；图片有替代文本；不只靠颜色区分
provenance: 定义需能追溯至来源；讲者归纳必须与来源原话区分。
