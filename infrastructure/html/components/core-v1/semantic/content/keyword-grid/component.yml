id: content.keyword-grid
version: 1.0.0
category: content
role: 以2–4项关键词判断组织问题提出或总结回顾
required_slots:
  - items
optional_slots:
  - source_ids
  - boundary
states:
  - draft
  - confirmed
template: template.html
styles: ../../semantic.css
responsive: 窄屏单列自然增高，长文本正常换行
accessibility: 标题与状态可见；图片有替代文本；不只靠颜色区分
provenance: 事实判断必须有source_ids；首尾复用时保持语义对应，不强制使用某四个词。
