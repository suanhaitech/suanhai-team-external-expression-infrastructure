schema_version: 2
repository: suanhai-team-external-expression-infrastructure
capabilities:
  - id: expression.task-loop
    kind: workflow
    path: harness/task-loop
    entrypoint: harness/task-loop/ENTRYPOINT.md
    purpose: 消费端Agent执行需求澄清、共识对齐、多轮反馈、暂停恢复与按任务号续作的文件工作协议；不自动调用模型或生成HTML
    uses:
      - expression.task-record
    inputs:
      - 用户请求或消费端任务编号
      - 消费端项目上下文与实际用户授权
    outputs:
      - 可追溯任务草案、用户决定、迭代状态与恢复入口
  - id: expression.task-record
    kind: tool
    path: harness/task-loop/scripts
    entrypoint: harness/task-loop/scripts/task_loop.py
    purpose: 使用Python标准库管理消费端任务JSON、阅读视图、状态流转与单文件产出摘要；不是权限系统或Agent执行器
    inputs:
      - 消费端根目录与任务操作
      - 已有任务写入所需的预期记录版本
    outputs:
      - tasks目录中的task.json与生成的task.md
      - JSON格式的任务状态或明确错误
  - id: html.project-report-v1
    kind: template
    path: templates/html-report/project-report-v1
    entrypoint: templates/html-report/project-report-v1/index.html
    purpose: 离线项目概览、阶段进展和对外汇报页面的静态 HTML/CSS 模板；不包含项目事实、不会调用网络服务
    inputs:
      - 已对齐的消费端任务简报和允许使用的来源
      - 需要替换的 data-slot 页面内容
    outputs:
      - 消费端作品目录中的可离线打开的 HTML 页面
      - 页面同目录的本地 CSS 文件
  - id: consumer.submodule-preflight
    kind: tool
    path: tools/submodule-preflight
    entrypoint: tools/submodule-preflight/submodule_preflight.py
    purpose: 只读核对消费端 submodule 的固定 gitlink、检出状态和远端稳定分支指针；不执行升级、回退或自动漂移
    inputs:
      - 消费端父仓库根目录和 submodule 相对路径
      - 可选的远端名称、稳定 ref、升级候选 commit 和检查超时
    outputs:
      - submodule-preflight.v1 JSON 或人类可读检查结果
  - id: consumer.group-asset-bootstrap
    kind: tool
    path: tools/group-asset-bootstrap
    entrypoint: tools/group-asset-bootstrap/materialize_template.py
    purpose: 在已固定基础设施 submodule 的消费端仓库中安全铺设小组资产仓模板；默认只预览、冲突时拒绝覆盖，不添加 submodule 或执行 Git 写操作
    inputs:
      - 消费端父仓库根目录
      - 已初始化且 gitlink 与 HEAD 一致的基础设施 submodule
      - 可选的 --dry-run（默认）或显式 --apply 模式
    outputs:
      - 新增的小组资产仓模板文件，或只读写入计划
  - id: consumer.group-asset-onboarding
    kind: workflow
    path: harness/group-asset-repository
    entrypoint: harness/group-asset-repository/ENTRYPOINT.md
    purpose: 引导负责人确认小组身份、零到多个项目上下文、来源和表达边界；保留未知项，不伪造任务或授权
    inputs:
      - 消费端小组负责人提供的真实信息和核对决定
      - 小组资产仓模板与来源材料
    outputs:
      - 小组级与项目级候选稿、逐项确认依据及保留的未知项
      - 待核对事项与初始化检查结果
    uses:
      - consumer.submodule-preflight
  - id: consumer.group-asset-create-and-initialize
    kind: workflow
    path: harness/group-asset-repository
    entrypoint: harness/group-asset-repository/CREATE_AND_INITIALIZE.md
    purpose: 在用户授权和明确创建参数后，从公开 GitHub 模版生成小组资产仓、克隆并核验固定基础设施，再转交仓内初始化 Harness；不修改组织权限、不提交或推送
    inputs:
      - 小组名称与目标仓库标识
      - 本地克隆位置及仓库可见性
      - 当前账号已登录的 gh CLI；组织建仓权限由 GitHub 模版生成 API 的结果验证
      - 可写 Agent 工作区及可用的 Git、Python 工具链
    outputs:
      - 从 GitHub 模版生成并递归克隆的小组资产仓
      - 保存在消费端的初始化候选、来源、待确认项和续接位置
    uses:
      - consumer.group-asset-onboarding
      - consumer.submodule-preflight
  - id: consumer.submodule-update
    kind: workflow
    path: workflows/submodule-update
    entrypoint: workflows/submodule-update/ENTRYPOINT.md
    purpose: 在消费端以用户确认、短期分支和可审阅记录为边界，更新基础设施 submodule 的父仓 gitlink；不自动跟随远端、不直接修改 main
    inputs:
      - 消费端父仓库根目录和 submodule 相对路径
      - 已验收的基础设施 commit、来源和兼容性说明
      - 用户对更新、提交和推送范围的明确确认
    outputs:
      - 更新前后的 gitlink、预检快照和验证结果
      - 消费端短期分支上的可审阅 gitlink 变更
    uses:
      - consumer.submodule-preflight
