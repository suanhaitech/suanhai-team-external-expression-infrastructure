schema_version: 2
repository: suanhai-team-external-expression-infrastructure
capabilities:
  - id: expression.task-loop
    kind: workflow
    path: workflows/task-loop
    entrypoint: workflows/task-loop/ENTRYPOINT.md
    purpose: 消费端Agent执行需求澄清、共识对齐、多轮反馈、暂停恢复与按任务号续作的文件工作协议；不自动调用模型或生成HTML
    uses:
      - expression.task-record
    inputs:
      - 用户请求或消费端任务编号
      - 消费端项目上下文与实际用户授权
    outputs:
      - 可追溯任务草案、用户决定、迭代状态与恢复入口
  - id: expression.task-record
    kind: tool
    path: infrastructure/task-loop/tools/task-record
    entrypoint: infrastructure/task-loop/tools/task-record/task_loop.py
    purpose: 使用Python标准库管理消费端任务JSON、阅读视图、状态流转与单文件/自包含目录产出摘要；支持消费端声明额外安全输出根，不是权限系统或Agent执行器
    inputs:
      - 消费端根目录与任务操作
      - 已有任务写入所需的预期记录版本
      - 可选的 .suanhai/expression.json 消费端作品输出根配置
    outputs:
      - tasks目录中的task.json与生成的task.md
      - 单文件或自包含目录作品的 SHA-256 评审记录
      - JSON格式的任务状态或明确错误
  - id: html.project-report-v1
    kind: template
    path: infrastructure/html/templates/presets/project-report-v1
    entrypoint: infrastructure/html/templates/presets/project-report-v1/index.html
    purpose: 离线项目概览、阶段进展和对外汇报页面的静态 HTML/CSS 模板；不包含项目事实、不会调用网络服务
    inputs:
      - 已对齐的消费端任务简报和允许使用的来源
      - 需要替换的 data-slot 页面内容
    outputs:
      - 消费端作品目录中的可离线打开的 HTML 页面
      - 页面同目录的本地 CSS 文件
  - id: html.presentation-deck-v1
    kind: template
    path: infrastructure/html/templates/presets/presentation-deck-v1
    entrypoint: infrastructure/html/templates/presets/presentation-deck-v1/index.html
    purpose: 离线、多页、可响应式适配的 HTML 演示稿模板；提供底部页码/前后页导航、键盘翻页、讲者备注、手动页面比例和逐页打印，不包含项目事实或外部资源
    inputs:
      - 已对齐的消费端任务简报和允许使用的来源
      - 需要替换或增删的逐页内容与图表
    outputs:
      - 消费端作品目录中的自包含多页 HTML 演示稿
      - 本地样式、翻页脚本和逐页来源标注结构
  - id: html.container.presentation-deck-v1
    kind: template
    path: infrastructure/html/templates/containers/presentation-deck-v1
    entrypoint: infrastructure/html/templates/containers/presentation-deck-v1/index.html
    purpose: 逐页 HTML 演示稿容器；通过 html.materialize 按顺序组合单页模板，提供底部页码、翻页、比例和逐页打印
  - id: html.single-page.cover.editorial-v1
    kind: template
    path: infrastructure/html/templates/single-page/cover/editorial-v1
    entrypoint: infrastructure/html/templates/single-page/cover/editorial-v1/page.html
    purpose: 可组合的出版物式封面单页模板
  - id: html.single-page.agenda.route-v1
    kind: template
    path: infrastructure/html/templates/single-page/agenda/route-v1
    entrypoint: infrastructure/html/templates/single-page/agenda/route-v1/page.html
    purpose: 可组合的阅读路线目录单页模板
  - id: html.single-page.transition.statement-v1
    kind: template
    path: infrastructure/html/templates/single-page/transition/statement-v1
    entrypoint: infrastructure/html/templates/single-page/transition/statement-v1/page.html
    purpose: 可组合的章节过渡单页模板
  - id: html.single-page.content.evidence-v1
    kind: template
    path: infrastructure/html/templates/single-page/content/evidence-v1
    entrypoint: infrastructure/html/templates/single-page/content/evidence-v1/page.html
    purpose: 可组合的证据与边界正文单页模板
  - id: html.single-page.content.method-v1
    kind: template
    path: infrastructure/html/templates/single-page/content/method-v1
    entrypoint: infrastructure/html/templates/single-page/content/method-v1/page.html
    purpose: 可组合的方法与路径正文单页模板
  - id: html.single-page.closing.action-v1
    kind: template
    path: infrastructure/html/templates/single-page/closing/action-v1
    entrypoint: infrastructure/html/templates/single-page/closing/action-v1/page.html
    purpose: 可组合的结论与行动单页模板
  - id: html.single-page.appendix.source-register-v1
    kind: template
    path: infrastructure/html/templates/single-page/appendix/source-register-v1
    entrypoint: infrastructure/html/templates/single-page/appendix/source-register-v1/page.html
    purpose: 可组合的来源登记附录单页模板
  - id: html.semantic-components-v1
    kind: template
    path: infrastructure/html/components/core-v1
    entrypoint: infrastructure/html/components/core-v1/README.md
    purpose: 可被不同消费端复制的离线 HTML 设计令牌、基础排版与布局原语、主题和六类语义组件 CSS/HTML 契约；响应式规则由独立样式包提供，不含公式引擎和自动预览
    inputs:
      - 消费端已对齐的页面内容与来源状态
      - 选择使用的语义组件
    outputs:
      - 可复制到消费端产物目录的本地 CSS 和语义 HTML 结构
      - 组件必填内容、状态、来源和可访问性契约
  - id: html.responsive-layout-v1
    kind: template
    path: infrastructure/html/styles/responsive-v1
    entrypoint: infrastructure/html/styles/responsive-v1/styles.css
    purpose: 可复用的 HTML 响应式布局、屏幕长宽比、方向、打印和安全溢出规则；不包含项目事实或浏览器运行时
    inputs:
      - 消费端 HTML 页面及其已选择的组件
      - 目标设备视口和打印范围
    outputs:
      - 可复制到消费端页面目录的本地响应式 CSS 和布局契约
      - 固定的多视口与打印行为说明
  - id: html.runtime-kit-v1
    kind: template
    path: infrastructure/html/runtime-kits/runtime-kit-v1
    entrypoint: infrastructure/html/runtime-kits/runtime-kit-v1/runtime.js
    purpose: 可物料化到 HTML 页面中的离线运行时包，提供本地 KaTeX 公式渲染、自动或手动显示模式、全屏入口和浏览器保存 PDF 入口；不替代确定性 PDF 导出工具
    inputs:
      - 页面中的 data-math 公式标记和可选的无障碍替代文本
      - 页面模板声明的运行时 CSS、工具栏和脚本插槽
      - 消费端可用的浏览器 Fullscreen API 和打印能力
    outputs:
      - 页面目录中的本地运行时 CSS、KaTeX 引擎、字体、工具栏和脚本
      - 可审计的运行时版本、许可证和离线资源清单
  - id: html.materialize
    kind: tool
    path: infrastructure/html/tools/materialize
    entrypoint: infrastructure/html/tools/materialize/materialize_html.py
    purpose: 从已固定的基础设施 submodule 中按 Manifest 能力 ID 安全复制完整预设，或按容器与有序单页 ID 组合 HTML 页面，再装配响应式布局、运行时包和组件包；可选记录已登记场景画像 ID；默认只预览，显式应用需匹配计划摘要和任务记录版本
    inputs:
      - 消费端根目录、已进入 working 状态的任务编号及固定 submodule gitlink
      - Manifest 中已登记的完整预设 ID，或容器 ID 与有序单页 ID；可选布局/运行时包 ID、组件包 ID 和语义组件 ID
      - 可选的 scenarios/catalog.json 场景画像 ID
      - dry-run 返回的计划摘要与任务记录版本
    outputs:
      - 消费端任务版本目录中的自包含 HTML、CSS、运行时和组件包文件
      - 记录任务元数据的 report.yml，以及基础设施 commit、模板/布局/运行时/组件版本和文件 SHA-256 的 materialization.json
  - id: html.pdf-export
    kind: tool
    path: infrastructure/html/tools/pdf-export
    entrypoint: infrastructure/html/tools/pdf-export/export_pdf.py
    purpose: 使用本机 Chrome、Edge 或 Chromium 将自包含 HTML 通过本地 HTTP 和 DevTools 打印为 PDF，并记录打印环境与文件哈希；找不到浏览器时明确返回 not-run
    inputs:
      - 消费端任务版本目录中的自包含 HTML 页面
      - 纸张、方向、页边距、缩放和背景打印参数
    outputs:
      - 任务版本目录中的 PDF 文件
      - pdf-export.json 导出配置、浏览器版本、字节数和 SHA-256
  - id: html.viewport-check
    kind: tool
    path: infrastructure/html/tools/viewport-check
    entrypoint: infrastructure/html/tools/viewport-check/viewport_check.py
    purpose: 检查自包含 HTML 的本地资源、viewport 元标签和多视口响应式行为；可选使用 Playwright 生成桌面、移动、宽屏和 A4 截图，浏览器不可用时明确返回 not-run
    inputs:
      - 消费端任务版本目录中的 index.html 和本地资源
      - 默认或自定义视口尺寸
    outputs:
      - 静态资源检查、多视口溢出结果和可选截图
      - 可保存的 JSON 检查记录
  - id: expression.html-production
    kind: workflow
    path: workflows/html/production
    entrypoint: workflows/html/production/ENTRYPOINT.md
    purpose: 跨消费端目录约定的 HTML 网页制作流程，组织需求澄清、来源记录、页面模板和组件选择、版本化产出、响应式检查、PDF 导出、反馈和人工收口；浏览器能力按本机可用性报告
    inputs:
      - 用户提出的 HTML 目标、受众、用途、范围和完成标准
      - 消费端项目上下文及用户提供的候选文档、链接和素材
      - 消费端自己的任务、作品目录、事实核对及发布授权边界
    outputs:
      - 消费端任务记录、来源清单和页面结构
      - 消费端中的版本化、自包含 HTML 产物及检查/评审记录
    uses:
      - expression.task-loop
      - expression.task-record
      - html.project-report-v1
      - html.presentation-deck-v1
      - html.container.presentation-deck-v1
      - html.single-page.cover.editorial-v1
      - html.single-page.agenda.route-v1
      - html.single-page.transition.statement-v1
      - html.single-page.content.evidence-v1
      - html.single-page.content.method-v1
      - html.single-page.closing.action-v1
      - html.single-page.appendix.source-register-v1
      - html.semantic-components-v1
      - html.responsive-layout-v1
      - html.runtime-kit-v1
      - html.materialize
      - html.viewport-check
      - html.pdf-export
  - id: consumer.submodule-preflight
    kind: tool
    path: infrastructure/repository-management/tools/submodule-preflight
    entrypoint: infrastructure/repository-management/tools/submodule-preflight/submodule_preflight.py
    purpose: 只读核对消费端 submodule 的固定 gitlink、检出状态和远端稳定分支指针；不执行升级、回退或自动漂移
    inputs:
      - 消费端父仓库根目录和 submodule 相对路径
      - 可选的远端名称、稳定 ref、升级候选 commit 和检查超时
    outputs:
      - submodule-preflight.v1 JSON 或人类可读检查结果
  - id: consumer.group-asset-bootstrap
    kind: tool
    path: infrastructure/group-asset-repository/tools/bootstrap
    entrypoint: infrastructure/group-asset-repository/tools/bootstrap/materialize_template.py
    purpose: 在已固定基础设施 submodule 的消费端仓库中安全铺设小组资产仓模板；默认只预览、冲突时拒绝覆盖，不添加 submodule 或执行 Git 写操作
    inputs:
      - 消费端父仓库根目录
      - 已初始化且 gitlink 与 HEAD 一致的基础设施 submodule
      - 可选的 --dry-run（默认）或显式 --apply 模式
    outputs:
      - 新增的小组资产仓模板文件，或只读写入计划
  - id: consumer.group-asset-onboarding
    kind: workflow
    path: workflows/group-asset-repository-onboarding
    entrypoint: workflows/group-asset-repository-onboarding/ENTRYPOINT.md
    purpose: 引导负责人确认小组身份、零到多个项目上下文、来源和表达边界；保留未知项，不伪造任务或授权
    inputs:
      - 消费端小组负责人提供的真实信息和核对决定
      - 小组资产仓模板与来源材料
    outputs:
      - 小组级与项目级候选稿、逐项确认依据及保留的未知项
      - 待核对事项与初始化检查结果
    uses:
      - consumer.submodule-preflight
  - id: consumer.group-asset-create-and-initialize
    kind: workflow
    path: workflows/group-asset-repository-create-and-initialize
    entrypoint: workflows/group-asset-repository-create-and-initialize/ENTRYPOINT.md
    purpose: 在用户授权和明确创建参数后，从公开 GitHub 模版生成小组资产仓、克隆并核验固定基础设施，再转交仓内初始化 Harness；不修改组织权限、不提交或推送
    inputs:
      - 小组名称与目标仓库标识
      - 本地克隆位置及仓库可见性
      - 当前账号已登录的 gh CLI；组织建仓权限由 GitHub 模版生成 API 的结果验证
      - 可写 Agent 工作区及可用的 Git、Python 工具链
    outputs:
      - 从 GitHub 模版生成并递归克隆的小组资产仓
      - 保存在消费端的初始化候选、来源、待确认项和续接位置
    uses:
      - consumer.group-asset-onboarding
      - consumer.submodule-preflight
  - id: consumer.submodule-update
    kind: workflow
    path: workflows/submodule-update
    entrypoint: workflows/submodule-update/ENTRYPOINT.md
    purpose: 在消费端以用户确认、短期分支和可审阅记录为边界，更新基础设施 submodule 的父仓 gitlink；不自动跟随远端、不直接修改 main
    inputs:
      - 消费端父仓库根目录和 submodule 相对路径
      - 已验收的基础设施 commit、来源和兼容性说明
      - 用户对更新、提交和推送范围的明确确认
    outputs:
      - 更新前后的 gitlink、预检快照和验证结果
      - 消费端短期分支上的可审阅 gitlink 变更
    uses:
      - consumer.submodule-preflight
  - id: consumer.infrastructure-adoption-harness
    kind: tool
    path: infrastructure/repository-management/tools/infrastructure-adoption-harness
    entrypoint: infrastructure/repository-management/tools/infrastructure-adoption-harness/install_harness.py
    purpose: 在已固定基础设施 submodule 的既有消费端仓库中预览或安装根 AGENTS.md 共享 Harness；默认只读，接入工作流授权后显式应用，冲突时拒绝，不提交或推送
    inputs:
      - 已固定且工作区干净的基础设施 submodule
      - 消费端父仓库根目录和 submodule 相对路径
      - dry-run 或接入工作流已授权的显式 apply 模式
    outputs:
      - 供负责人审阅的 Harness 安装计划
      - 已写入或保持不变的带标记根 AGENTS.md
      - gitlink、submodule HEAD 和 Manifest 注册检查结果
  - id: consumer.infrastructure-adoption
    kind: workflow
    path: workflows/infrastructure-adoption
    entrypoint: workflows/infrastructure-adoption/ENTRYPOINT.md
    purpose: 在不采用公共模板的既有仓库中，按本次提示词授予的有限本地权限接入固定版本的基础设施 submodule，并幂等增补消费端根 AGENTS.md Harness；不覆盖本仓规则、不自动提交或升级，已有旧版本需另行授权更新到兼容版本
    inputs:
      - 既有父仓库根目录、Git 状态和仓库自身分支/权限约定
      - 既有仓库清楚约定或默认的 submodule 相对路径，以及稳定 main 解析出的完整基础设施 commit SHA
      - 本仓已有 AGENTS.md、上下文、任务、产物和 CI 约定
    outputs:
      - 固定 commit 的 submodule gitlink 和 .gitmodules 配置
      - 父仓根 AGENTS.md 中可重复执行的消费端能力发现 Harness
      - Manifest、gitlink、工作区和预检核对结果
    uses:
      - consumer.infrastructure-adoption-harness
      - consumer.submodule-preflight
